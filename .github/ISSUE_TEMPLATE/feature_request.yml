name: ✨ Feature request / 功能建议
description: Suggest an idea for All-Tools / 提出新功能建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? / 要解决的问题
      placeholder: I'm always frustrated when… / 目前的痛点是…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like / 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
