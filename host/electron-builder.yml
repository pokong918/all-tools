appId: com.alltools.host
productName: All-Tools
copyright: MIT

directories:
  output: ../dist
  buildResources: build

files:
  - out/**
  - "!**/*.map"

# 内置资源：官方 Manifest 库 + Node sidecar（FR-DIST-08）+ 托盘图标
extraResources:
  - from: ../manifests
    to: manifests
    filter:
      - "**/*"
  - from: ./build-resources/runtimes
    to: runtimes
    filter:
      - "**/*"
  - from: ./build
    to: build
    filter:
      - "icon-32.png"

asar: true

# 发布渠道（FR-DIST-07）：electron-updater 依据此配置生成/读取 latest.yml
publish:
  provider: github
  owner: pokong918
  repo: all-tools

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: All-Tools-Setup-${version}.${ext}

portable:
  artifactName: All-Tools-Portable-${version}.${ext}
